name: Dependency security audit

on:
  schedule:
    - cron: '37 2 * * 1'
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - '.npmrc'
      - '.github/workflows/dependency-security-audit.yml'
      - '.github/dependabot.yml'
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - '.npmrc'
      - '.github/workflows/dependency-security-audit.yml'
      - '.github/dependabot.yml'

permissions:
  contents: read

concurrency:
  group: dependency-security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    name: Audit ${{ matrix.directory }} (all dependency types)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        directory: ["."]
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      # Audit the tracked lock without installing dependencies or executing their scripts.
      # Registry/setup failures stay nonzero; no findings are ignored.
      - name: Audit production, development, optional and peer dependencies
        run: npm audit --package-lock-only --include=prod --include=dev --include=optional --include=peer --audit-level=high

  dependency-audit-result:
    if: always()
    needs: dependency-audit
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Require every dependency audit to succeed
        env:
          AUDIT_RESULT: ${{ needs.dependency-audit.result }}
        run: |
          if [[ "$AUDIT_RESULT" != "success" ]]; then
            echo "::error::Dependency audits failed, were cancelled, or did not run."
            exit 1
          fi
